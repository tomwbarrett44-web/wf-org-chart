<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wells Fargo Technology Org Chart</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap');

:root {
  --red: #C8102E;
  --gold: #FFCD00;
  --dark: #111111;
  --mid: #444444;
  --light: #F7F5F0;
  --white: #FFFFFF;
  --border: #DDD9D0;
  --shadow: rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--light);
  color: var(--dark);
  min-height: 100vh;
}

#header {
  background: var(--red);
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 3px 16px rgba(200,16,46,0.35);
}

.brand { display: flex; align-items: center; gap: 14px; }

.brand-icon {
  width: 44px; height: 44px;
  background: var(--gold);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}

.brand h1 {
  font-family: 'Libre Baskerville', serif;
  font-size: 18px; color: white; letter-spacing: 0.01em; line-height: 1.2;
}

.brand p {
  font-size: 11px; color: rgba(255,255,255,0.7);
  letter-spacing: 0.07em; text-transform: uppercase; margin-top: 2px;
}

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

#searchInput {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px; padding: 7px 13px;
  color: white; font-family: 'DM Sans', sans-serif;
  font-size: 13px; width: 200px; outline: none;
  transition: background 0.2s, border-color 0.2s;
}
#searchInput::placeholder { color: rgba(255,255,255,0.5); }
#searchInput:focus { background: rgba(255,255,255,0.22); border-color: var(--gold); }

.btn {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px; padding: 7px 13px;
  color: white; font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: background 0.15s; white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.22); }
.btn.accent { background: var(--gold); color: var(--dark); border-color: var(--gold); font-weight: 600; }
.btn.accent:hover { background: #e6b800; }

#legend {
  background: white; border-bottom: 1px solid var(--border);
  padding: 10px 32px; display: flex; align-items: center;
  gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--mid);
}
.legend-label { font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
.leg { display: flex; align-items: center; gap: 5px; }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.hint { margin-left: auto; font-size: 11px; font-style: italic; color: #999; }

#canvas { padding: 40px 24px 80px; overflow-x: auto; }

.tree { display: flex; flex-direction: column; align-items: center; }
.node-block { display: flex; flex-direction: column; align-items: center; }

.node {
  background: white; border-radius: 8px; padding: 11px 15px;
  min-width: 190px; max-width: 250px; cursor: pointer;
  border: 2px solid var(--border);
  box-shadow: 0 2px 8px var(--shadow);
  transition: box-shadow 0.2s, transform 0.2s;
  position: relative; user-select: none;
}
.node:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
.node[data-level="0"] { background: var(--red); border-color: var(--red); color: white; min-width: 220px; }
.node[data-level="1"] { border-left: 4px solid #8B1A2E; }
.node[data-level="2"] { border-left: 4px solid #1A4B8C; }
.node[data-level="3"] { border-left: 4px solid #1A6644; }
.node[data-level="4"] { border-left: 4px solid #7A5C1E; }

.node-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
.node[data-level="0"] .node-name { font-family: 'Libre Baskerville', serif; font-size: 14px; }
.node-title { font-size: 11px; line-height: 1.4; margin-top: 3px; color: var(--mid); font-weight: 400; }
.node[data-level="0"] .node-title { color: var(--gold); font-weight: 500; }

.node-notes {
  font-size: 10px; line-height: 1.4; margin-top: 6px; padding-top: 6px;
  border-top: 1px solid var(--border); color: #777; font-style: italic; display: none;
}
.node[data-level="0"] .node-notes { border-top-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.75); }
.node.open .node-notes { display: block; }

.ea-tag {
  display: inline-block; background: #FFF3CC; color: #7A5C1E;
  font-size: 9px; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; padding: 2px 5px; border-radius: 3px; margin-bottom: 5px;
}

.badge {
  display: inline-block; background: var(--red); color: white;
  font-size: 9px; font-weight: 700; padding: 1px 5px;
  border-radius: 10px; margin-left: 4px; vertical-align: middle;
}
.node[data-level="0"] .badge { background: rgba(255,255,255,0.25); }

.tog {
  position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%);
  width: 22px; height: 22px; background: var(--red); color: white;
  border: 2px solid white; border-radius: 50%; font-size: 13px;
  font-weight: 700; line-height: 18px; text-align: center;
  cursor: pointer; z-index: 10;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  transition: background 0.15s, transform 0.15s;
}
.tog:hover { background: var(--dark); transform: translateX(-50%) scale(1.1); }

.v-line { width: 2px; height: 22px; background: var(--border); }
.children-wrap { display: flex; flex-direction: column; align-items: center; }

.h-row {
  display: flex; gap: 14px; justify-content: center;
  position: relative; padding-top: 22px;
}
.h-row::before {
  content: ''; position: absolute; top: 0; left: 50%;
  width: 2px; height: 22px; background: var(--border); transform: translateX(-50%);
}
.h-row.multi::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: var(--border);
}

.child-col { display: flex; flex-direction: column; align-items: center; position: relative; }
.child-col::before {
  content: ''; position: absolute; top: 0; left: 50%;
  width: 2px; height: 22px; background: var(--border); transform: translateX(-50%);
}

.collapsed { display: none !important; }
.dimmed { opacity: 0.15 !important; }
.highlighted { outline: 3px solid var(--gold) !important; outline-offset: 2px; }

@media print {
  #header .toolbar { display: none; }
  #legend .hint { display: none; }
  body { background: white; }
  #canvas { padding: 20px; }
}
</style>
</head>
<body>

<div id="header">
  <div class="brand">
    <div class="brand-icon">🏦</div>
    <div>
      <h1>Wells Fargo Technology</h1>

    </div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search name or title...">
    <button class="btn" onclick="expandAll()">Expand All</button>
    <button class="btn" onclick="collapseAll()">Collapse All</button>
    <button class="btn accent" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>

<div id="legend">
  <span class="legend-label">Key:</span>
  <div class="leg"><div class="leg-dot" style="background:#C8102E"></div> CEO</div>
  <div class="leg"><div class="leg-dot" style="background:#8B1A2E"></div> Head of Technology</div>

<div id="canvas"></div>

function buildTree() {
  const byName = {};
  ORG_DATA.forEach(p => { byName[p.name] = { ...p, children: [] }; });
  let root = null;
  ORG_DATA.forEach(p => {
    if (!p.reportsTo) { root = byName[p.name]; }
    else if (byName[p.reportsTo]) { byName[p.reportsTo].children.push(byName[p.name]); }
  });
  return root;
}

function assignLevels(node, level = 0) {
  node.level = level;
  node.children.forEach(c => assignLevels(c, level + 1));
}

function renderNode(node) {
  const block = document.createElement('div');
  block.className = 'node-block';

  const card = document.createElement('div');
  card.className = 'node';
  card.dataset.level = Math.min(node.level, 4);
  card.dataset.name = node.name.toLowerCase();
  card.dataset.title = (node.title || '').toLowerCase();

  let inner = '';
  if (node.isEA) inner += '<div class="ea-tag">Executive Assistant</div>';
  const badge = node.children.length ? `<span class="badge">${node.children.length}</span>` : '';
  inner += `<div class="node-name">${node.name}${badge}</div>`;
  if (node.title) inner += `<div class="node-title">${node.title}</div>`;
  if (node.notes) inner += `<div class="node-notes">${node.notes}</div>`;
  card.innerHTML = inner;

  if (node.notes) {
    card.addEventListener('click', e => {
      if (e.target.classList.contains('tog')) return;
      card.classList.toggle('open');
    });
  }

  block.appendChild(card);

  if (node.children.length) {
    const tog = document.createElement('div');
    tog.className = 'tog';
    tog.textContent = '-';
    tog.addEventListener('click', e => {
      e.stopPropagation();
      const wrap = block.querySelector(':scope > .children-wrap');
      const isNowCollapsed = wrap.classList.toggle('collapsed');
      tog.textContent = isNowCollapsed ? '+' : '-';
    });
    card.appendChild(tog);

    const wrap = document.createElement('div');
    wrap.className = 'children-wrap';

    const vLine = document.createElement('div');
    vLine.className = 'v-line';
    wrap.appendChild(vLine);

    const row = document.createElement('div');
    row.className = `h-row${node.children.length > 1 ? ' multi' : ''}`;

    node.children.forEach(child => {
      const col = document.createElement('div');
      col.className = 'child-col';
      col.appendChild(renderNode(child));
      row.appendChild(col);
    });

    wrap.appendChild(row);
    block.appendChild(wrap);
  }

  return block;
}

function expandAll() {
  document.querySelectorAll('.children-wrap').forEach(w => w.classList.remove('collapsed'));
  document.querySelectorAll('.tog').forEach(t => t.textContent = '-');
}

function collapseAll() {
  document.querySelectorAll('.children-wrap').forEach(w => w.classList.add('collapsed'));
  document.querySelectorAll('.tog').forEach(t => t.textContent = '+');
}

function doSearch(q) {
  q = q.trim().toLowerCase();
  const allCards = document.querySelectorAll('.node');
  if (!q) {
    allCards.forEach(c => c.classList.remove('dimmed', 'highlighted'));
    return;
  }
  allCards.forEach(card => {
    const match = card.dataset.name.includes(q) || card.dataset.title.includes(q);
    card.classList.toggle('dimmed', !match);
    card.classList.toggle('highlighted', match);
    if (match) {
      let el = card.parentElement;
      while (el) {
        if (el.classList.contains('children-wrap')) {
          el.classList.remove('collapsed');
          const togEl = el.previousElementSibling && el.previousElementSibling.querySelector('.tog');
          if (togEl) togEl.textContent = '-';
        }
        el = el.parentElement;
      }
    }
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => doSearch(e.target.value));

const root = buildTree();
assignLevels(root);
const tree = document.createElement('div');
tree.className = 'tree';
tree.appendChild(renderNode(root));
document.getElementById('canvas').appendChild(tree);
</script>

</body>
